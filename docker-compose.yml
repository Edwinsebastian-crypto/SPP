name: spp

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - monolito

  monolito:
    build:
      context: ./spp_practicas
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: America/Bogota
      DATABASE_URL_PRACTICE: ${DATABASE_URL_PRACTICE}
      MONGO_URI_PRIMARY: ${MONGO_URI_PRIMARY:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      INSTITUTIONAL_DOMAIN: ${INSTITUTIONAL_DOMAIN:-udi.edu.co}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EVALUATION_SERVICE_URL: http://evaluacion:8000
      EVALUATION_SERVICE_SECRET: ${S_EVAL}
      NOTIFICATION_SERVICE_URL: http://notificaciones:4000
      NOTIFICATION_SERVICE_SECRET: ${S_NOTIF}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
    depends_on:
      - evaluacion
      - notificaciones

  evaluacion:
    build:
      context: ./servicio_evaluacion/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_EVALUACION}
      AUTO_CREATE_TABLES: "false"
      AUTH_MODE: jwt
      JWT_SECRET: ${S_EVAL}
      NOTIFICATION_SERVICE_SECRET: ${S_NOTIF}
      CORS_ORIGINS: ""
      EVIDENCIAS_MODE: http
      EVIDENCIAS_API_URL: http://monolito:3000/api/internal
      EVIDENCIAS_API_TOKEN: ${S_EVAL}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  notificaciones:
    build:
      context: ./servicio_notificaciones
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      TZ: America/Bogota
      NODE_ENV: production
      NOTIFICATION_SERVICE_SECRET: ${S_NOTIF}
      MONGO_URI_NOTIFICATIONS: ${MONGO_URI_NOTIFICATIONS}
      MONOLITH_URL: http://monolito:3000
      EVALUATION_SERVICE_URL: http://evaluacion:8000
      EVALUATION_SERVICE_SECRET: ${S_EVAL}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-"SPP <no-reply@udi.edu.co>"}
      APP_URL: https://${DOMAIN}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}

volumes:
  caddy_data:
  caddy_config:
